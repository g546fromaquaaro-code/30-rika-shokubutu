<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>中1理科 100問ノートテスト</title><link rel="stylesheet" href="style100.css"></head><body>
<header><div><b>中1理科</b><span>夏休み明け対策</span></div><button id="homeBtn">メニュー</button></header>
<main>
<section id="menu" class="panel"><h1>100問 ノートテスト</h1><p>問題は画面で確認。答えはノートに書いてから「答えを見る」で自己採点します。</p><div class="stats" id="stats"></div><h2>出題モード</h2><div class="grid"><button data-mode="all">100問 全部</button><button data-mode="random20">ランダム20問</button><button data-mode="mistakes">△・×だけ復習</button></div><h2>分野別</h2><div id="cats" class="grid cats"></div><p class="small">図問題だけに偏らず、用語・顕微鏡操作・植物・動物・分類・記述・考察を満遍なく収録しています。</p></section>
<section id="quiz" class="panel hidden"><div class="meta"><span id="cat"></span><span id="lv"></span><span id="count"></span></div><div class="progress"><i id="prog"></i></div><div id="imgBox" class="imgbox hidden"><div id="qimg" class="sprite" role="img" aria-label="問題図"></div></div><h2 id="qtext"></h2><div class="notePrompt">✎ ノートに答えを書いてから進もう</div><button id="ansBtn" class="secondary">答えを見る</button><div id="answer" class="answer hidden"></div><div id="judge" class="judge hidden"><span>自己採点</span><button data-mark="○">○</button><button data-mark="△">△</button><button data-mark="×">×</button></div><div class="nav"><button id="prev">← 前</button><button id="next">次 →</button></div></section>
<section id="result" class="panel hidden"><h1>結果</h1><div id="resultBody"></div><button id="retry">△・×を復習</button><button id="back" class="secondary">メニューへ</button></section>
</main><script src="questions100.js"></script><script src="app100.js"></script></body></html>
